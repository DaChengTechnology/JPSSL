[package]
name = "rustls_interop"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "jpssl <-> rustls TLS 1.2/1.3 interop helper (independent implementation)"
license = "MIT"

[dependencies]
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
