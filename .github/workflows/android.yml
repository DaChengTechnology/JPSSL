name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-android:
    name: Build AAR (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.1.7779620" \
            "cmake;3.22.1"

      - name: Build release AAR
        run: gradle -p android assembleRelease

      - name: Verify AAR contains arm64 native lib
        run: |
          ls -la android/jpssl/build/outputs/aar/
          unzip -l android/jpssl/build/outputs/aar/jpssl-release.aar \
            | grep -E 'lib/arm64-v8a/libjpssl\.so'
