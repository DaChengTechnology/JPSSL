name: Debug ARM

on:
  workflow_dispatch:
  push:
    branches: [debug/arm-tls]

jobs:
  debug-arm:
    name: Debug ARM ctest
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests (logged, bounded)
        run: |
          set +e
          ctest --test-dir build --output-on-failure --timeout 60 > /tmp/ctest.out 2>&1
          echo "CTEST_EXIT=$?" | tee -a /tmp/ctest.out
          cp build/Testing/Temporary/LastTest.log /tmp/LastTest.log 2>/dev/null || true
          tail -60 /tmp/ctest.out

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: arm-debug-logs
          path: |
            /tmp/ctest.out
            /tmp/LastTest.log
          if-no-files-found: warn
