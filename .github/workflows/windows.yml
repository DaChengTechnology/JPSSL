name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & test (x64 MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSSL (optional)
        shell: pwsh
        run: |
          choco install openssl -y --no-progress --accept-license
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::OpenSSL install failed; OpenSSL comparison tests will be skipped"
          }

      # choco 的 OpenSSL 安装路径随版本变化（旧镜像 OpenSSL-Win64，新镜像 OpenSSL）；
      # 动态探测实际安装目录，未找到时 OpenSSL 对比测试自动跳过。
      - name: Locate OpenSSL
        shell: pwsh
        run: |
          $dirs = @('C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64', 'C:\Program Files\OpenSSL-Win32')
          $found = $dirs | Where-Object { Test-Path "$_\lib" } | Select-Object -First 1
          if ($found) {
            Write-Host "OpenSSL found at $found"
            echo "OPENSSL_ROOT_DIR=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "::warning::OpenSSL not found; OpenSSL comparison tests will be skipped"
          }

      # 不用 "Visual Studio 17 2022" 生成器（windows-latest 镜像的 VS 实例发现
      # 不稳定会导致 "could not find any instance of Visual Studio"），改用
      # msvc-dev-cmd 注入 MSVC 环境 + Ninja 生成器，与 VS 版本/检测解耦。
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Ninja, x64)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # 排除计时敏感的 bench_*（在单独 job 中只构建、不运行，避免 CI 负载下的偶发失败）
      - name: Run tests
        run: ctest --test-dir build --output-on-failure -E bench

  bench:
    name: Build benchmarks (x64 MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # benchmarks 无条件链接 OpenSSL::Crypto，构建前必须安装
      - name: Install OpenSSL
        shell: pwsh
        run: choco install openssl -y --no-progress --accept-license

      - name: Locate OpenSSL
        shell: pwsh
        run: |
          $dirs = @('C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64', 'C:\Program Files\OpenSSL-Win32')
          $found = $dirs | Where-Object { Test-Path "$_\lib" } | Select-Object -First 1
          if ($found) {
            Write-Host "OpenSSL found at $found"
            echo "OPENSSL_ROOT_DIR=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "::error::OpenSSL not found (benchmarks require OpenSSL)"
            exit 1
          }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure benchmarks (Ninja, x64)
        run: cmake -S . -B build-bench -G Ninja -DCMAKE_BUILD_TYPE=Release -DJP_ENABLE_BENCH=ON

      - name: Build benchmarks
        run: cmake --build build-bench --parallel
