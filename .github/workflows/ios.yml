name: iOS XCFramework CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-xcframework:
    name: Build iOS XCFramework (arm64 / iOS 13+)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake & Ninja
        run: |
          brew install cmake ninja
          xcodebuild -version

      - name: Build XCFramework (device + simulator, arm64)
        run: ./ios/build-xcframework.sh

      - name: Verify XCFramework slices
        run: |
          echo "== Slices =="
          plutil -p ios/JPSsl.xcframework/Info.plist | grep -A4 'AvailableLibraries'
          file ios/JPSsl.xcframework/*/JPSslC.framework/JPSslC || true

      - name: Swift compile smoke test
        run: |
          FW_DIR="ios/JPSsl.xcframework/$(ls ios/JPSsl.xcframework | grep simulator | head -1)/JPSslC.framework"
          echo "Using framework: $FW_DIR"
          cat > /tmp/smoke.swift <<'EOF'
          import JPSsl
          let digest = JPSsl.Hash.SHA256.hash(Array("abc".utf8))
          precondition(digest.count == 32, "SHA-256 output length")
          let (pub, priv) = JPSsl.Ed25519.keyPair()
          let msg = Array("jpssl".utf8)
          let sig = JPSsl.Ed25519.sign(privateKey: priv, message: msg)
          precondition(JPSsl.Ed25519.verify(publicKey: pub, message: msg, signature: sig))
          let enc = JPSsl.ChaCha20.encrypt(key: [UInt8](repeating: 0, count: 32),
                                           nonce: [UInt8](repeating: 1, count: 12),
                                           plaintext: msg)
          precondition(enc != nil)
          print("smoke OK")
          EOF
          swiftc -typecheck \
            -target arm64-apple-ios13.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -F "$(dirname "$FW_DIR")" \
            ios/Sources/JPSsl/JPSsl.swift /tmp/smoke.swift
          echo "Swift smoke OK"
